{{range .}}
<section class="acct-group group-{{.Class}}">
  <header class="acct-group-head">
    <h3>{{.Name}}</h3>
    <span class="acct-group-total">Rp. {{formatNumber .Total}}</span>
  </header>
  <div class="acct-cards">
    {{range .Cards}}
      <article class="acct-card group-{{.Class}}">
        <div class="acct-card-top">
          <span class="acct-name">{{.Name}}</span>
          <span class="group-pill">{{.GroupName}}</span>
        </div>
        <div class="acct-balance">Rp. {{formatNumber .Balance}}</div>
        {{if .ShowCredit}}
          <div class="acct-credit">
            <span>Limit Rp. {{formatNumber .CreditLimit}}</span>
            <span>Available Rp. {{formatNumber .AvailableCredit}}</span>
          </div>
        {{end}}
        <button type="button" class="adjust-balance-btn" data-id="{{.ID}}" data-name="{{.Name}}">Adjust balance</button>
      </article>
    {{end}}
  </div>
</section>
{{else}}
  <p class="muted">No accounts found</p>
{{end}}
