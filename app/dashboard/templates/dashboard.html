<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · {{.SelectedName}}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/transaction-grid.css" />
  <link rel="stylesheet" href="/static/dashboard.css" />
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body data-owner-id="{{.SelectedOwnerID}}">
  <div class="app-shell">
    <aside class="sidebar" aria-label="Owners">
      <nav class="sidebar-nav">
        <span class="sidebar-label">Owners</span>
        {{range .Owners}}
          <a href="/dashboard?owner={{.ID}}" class="sidebar-link{{if eq .ID $.SelectedOwnerID}} is-active{{end}}"{{if eq .ID $.SelectedOwnerID}} aria-current="page"{{end}}>{{.DisplayName}}</a>
        {{end}}
      </nav>
    </aside>
    <div class="dash">
      <header class="dash-header">
        <div>
          <h1>drfin</h1>
          <p class="muted">Personal finance overview · {{.SelectedName}}</p>
        </div>
        <nav class="quick-actions" aria-label="Quick actions">
          <button type="button" id="add-account-btn" class="btn">+ Add Account</button>
          <button type="button" id="new-transaction-btn" class="btn btn-primary">+ New Transaction</button>
          <a href="#all-transactions" class="btn btn-ghost">View Transactions</a>
        </nav>
      </header>

      <section id="overview-grid" class="dash-section" aria-label="Financial overview"></section>

      <section class="dash-section">
        <h2>My Accounts</h2>
        <div id="accounts-grid"></div>
      </section>

      <div class="dash-two-col">
        <section class="card">
          <h2>Income vs Expenses</h2>
          <div id="cashflow-grid"></div>
        </section>
        <section class="card">
          <h2>Expense Breakdown</h2>
          <div id="categories-grid"></div>
        </section>
      </div>

      <section class="card dash-section">
        <div class="card-head">
          <h2>Recent Transactions</h2>
          <a href="#all-transactions">View all</a>
        </div>
        <div id="recent-grid"></div>
      </section>

      <section id="all-transactions" class="card dash-section">
        <h2>All Transactions</h2>
        <div id="transactions-grid"></div>
      </section>
    </div>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
      <div class="modal">
        <div id="modal-content"></div>
      </div>
    </div>

  <script>
    const OWNER_ID = document.body.dataset.ownerId;

    function withOwner(url) {
      return url + (url.includes("?") ? "&" : "?") + "owner=" + encodeURIComponent(OWNER_ID);
    }

    async function loadFragment(url, id) {
      const el = document.getElementById(id);
      try {
        const res = await fetch(withOwner(url));      // <- was fetch(url)
        el.innerHTML = res.ok
          ? await res.text()
          : '<p class="muted">Could not load this section.</p>';
      } catch (err) {
        el.innerHTML = '<p class="muted">Could not load this section.</p>';
      }
    }

    async function loadGrids() {
      await Promise.all([
        loadFragment("/dashboard/overview", "overview-grid"),
        loadFragment("/dashboard/accounts", "accounts-grid"),
        loadFragment("/dashboard/cashflow", "cashflow-grid"),
        loadFragment("/dashboard/categories", "categories-grid"),
        loadFragment("/dashboard/recent", "recent-grid"),
        loadFragment("/dashboard/transactions", "transactions-grid")
      ]);
    }

    loadGrids();

    document
    .getElementById("new-transaction-btn")
    .addEventListener("click", function () {
      console.log("clicked");
      openCreateModal();
    });

    document
    .getElementById("add-account-btn")
    .addEventListener("click", function () {
      openAccountModal();
    });

    async function openAccountModal() {
      const response = await fetch("/dashboard/accounts/new");
      document.getElementById("modal-content").innerHTML = await response.text();
      document.getElementById("modal-overlay").style.display = "flex";
    }

    async function openCreateModal() {

      const response = await fetch(
        "/dashboard/transactions/new"
      );

      const html = await response.text();

      document.getElementById("modal-content").innerHTML = html;

      document.getElementById("modal-overlay").style.display = "flex";
    }
    
    // Open modal when Edit button clicked
    document.addEventListener("click", function (e) {
      if (e.target.classList.contains("edit-btn")) {
        const id = e.target.dataset.id;
        openEditModal(id);
      }
    });

    async function openEditModal(id) {
      const response = await fetch(`/dashboard/transactions/${id}/edit`);
      const html = await response.text();

      document.getElementById("modal-content").innerHTML = html;
      document.getElementById("modal-overlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal-overlay").style.display = "none";
      document.getElementById("modal-content").innerHTML = "";
    }

    async function reloadDashboardSections() {
      // balances, totals, charts and lists all depend on transactions
      await loadGrids();
    }

    // ✅ STEP 6 — Handle Save Submit (THIS is step 6)
    document.addEventListener("submit", async function (e) {

      if (e.target.id !== "edit-form") {
          return;
      }

      e.preventDefault();

      const form = e.target;
      const id = form.dataset.id;

      const payload = {
          type: form.elements.type.value,
          account: form.elements.account.value,
          account_dest: form.elements.account_dest?.value || "",
          category: form.elements.category.value
      };

      const response = await fetch(`/dashboard/transactions/${id}`, {
          method: "PUT",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
      });

      if (!response.ok) {
          const text = await response.text();
          alert(text);
          return;
      }

      closeModal();

      await reloadDashboardSections();
    });

    // =====================================================
    // Transaction Type → Destination Account visibility
    // =====================================================

    document.addEventListener("change", function (e) {

        if (e.target.id !== "transaction-type") {
            return;
        }

        const typeSelect = e.target;

        const destinationContainer =
            document.getElementById("destination-account-container");

        const destinationSelect =
            document.getElementById("account-dest");

        if (!destinationContainer) {
            return;
        }

        const isTransfer = typeSelect.value === "Transfer";

        destinationContainer.style.display =
            isTransfer ? "block" : "none";

        // Clear destination when changing away from Transfer
        if (!isTransfer && destinationSelect) {
            destinationSelect.value = "";
        }
    });

    document.addEventListener("submit", async function (e) {

      if (e.target.id === "create-form") {

        e.preventDefault();

        const form = e.target;

        const tradeDate = form.trade_date.value;

        const payload = {
          trade_date: new Date(tradeDate).toISOString(),
          type: form.type.value,
          category: form.category.value,
          account_id: form.account.value,
          account_dest_id: form.account_dest?.value || "",
          amount: form.amount.value,
          description: form.description.value,
          status: "CONFIRMED",
          source: "MANUAL",
          owner_id: parseInt(OWNER_ID, 10)

        };

        const response = await fetch("/transactions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          alert("Failed to create transaction");
          return;
        }

        closeModal();

        await reloadDashboardSections();
      }
    });

    async function applyDateFilter() {
      const from = document.getElementById("date-from").value;
      const to   = document.getElementById("date-to").value;

      const html = await (await fetch(
        `/dashboard/categories?from=${from}&to=${to}`
      )).text();

      document.getElementById("categories-grid").innerHTML = html;
    }

    // Cancel (soft delete): server reverses the balances and marks the row Cancelled.
    document.addEventListener("click", async function (e) {

      const btn = e.target.closest(".cancel-transaction-btn");
      if (!btn) {
        return;
      }

      const confirmed = confirm(
        "Cancel this transaction? Balances will be reversed. This can't be undone."
      );

      if (!confirmed) return;

      btn.disabled = true;

      const response = await fetch(
        `/dashboard/transactions/${btn.dataset.id}/cancel`,
        { method: "POST" }
      );

      if (!response.ok) {
        const text = (await response.text()).trim();
        alert(text || "Failed to cancel transaction");
        await reloadDashboardSections();
        return;
      }

      location.reload(); // balances changed: refreshes every section
    });

    document.addEventListener("click", async function (e) {

      // Open new receivable form
      if (e.target.id === "new-receivable-btn") {

          const form =
              document.getElementById("new-receivable-form");

          const input =
              document.getElementById("new-receivable-name");

          form.style.display = "block";
          input.focus();

          return;
      }


      // Cancel
      if (e.target.id === "cancel-receivable-btn") {

          const form =
              document.getElementById("new-receivable-form");

          const input =
              document.getElementById("new-receivable-name");

          form.style.display = "none";
          input.value = "";

          return;
      }


      // Create receivable
      if (e.target.id === "create-receivable-btn") {

          const input =
              document.getElementById("new-receivable-name");

          const name =
              input.value.trim();

          if (!name) {
              alert("Receivable name is required");
              return;
          }


          const response = await fetch(
              "/accounts/receivable",
              {
                  method: "POST",

                  headers: {
                      "Content-Type": "application/json"
                  },

                  body: JSON.stringify({
                      name: name
                  })
              }
          );


          if (!response.ok) {

              const error =
                  await response.text();

              alert(error);

              return;
          }


          const account =
              await response.json();


          // Add the newly created account
          // to destination dropdown
          const destinationSelect =
              document.getElementById("account-dest");

          const option =
              document.createElement("option");

          option.value = account.name;
          option.textContent = account.name;
          option.selected = true;

          destinationSelect.appendChild(option);


          // Hide creation form
          document.getElementById(
              "new-receivable-form"
          ).style.display = "none";

          input.value = "";
      }

  });
    // =====================================================
    // Accounts: create account + adjust balance
    // (must live here: scripts inside innerHTML partials never run)
    // =====================================================

    async function postJSON(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        throw new Error((await res.text()).trim() || res.statusText);
      }
      return res.json();
    }

    document.addEventListener("submit", async function (e) {
      if (e.target.id !== "create-account-form") {
        return;
      }
      e.preventDefault();

      const form = e.target;
      try {
        await postJSON("/accounts", {
          name: form.elements["name"].value,
          account_group_id: parseInt(form.elements["account_group_id"].value, 10),
          initial_balance: form.elements["initial_balance"].value,
          credit_limit: form.elements["credit_limit"].value,
          owner_id: parseInt(OWNER_ID, 10)
        });
        location.reload(); // refreshes every section
      } catch (err) {
        alert("Could not create account: " + err.message);
      }
    });

    document.addEventListener("click", async function (e) {
      const btn = e.target.closest(".adjust-balance-btn");
      if (!btn) {
        return;
      }

      const value = prompt('New balance for "' + btn.dataset.name + '":');
      if (value === null) {
        return;
      }

      try {
        const res = await postJSON(
          "/accounts/" + btn.dataset.id + "/adjust-balance",
          { new_balance: value }
        );
        if (!res.transaction_id) {
          alert("Balance is already " + res.new_balance + ". Nothing changed.");
          return;
        }
        location.reload();
      } catch (err) {
        alert("Could not adjust balance: " + err.message);
      }
    });
  </script>
</body>
</html>
