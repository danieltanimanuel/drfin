<div class="cat-breakdown">
  <div class="date-filter">
    <input type="date" id="date-from" value="{{.CurrentMonthStart}}">
    <span>to</span>
    <input type="date" id="date-to" value="{{.CurrentMonthEnd}}">
    <button type="button" onclick="applyDateFilter()">Apply</button>
  </div>

  {{if .Items}}
    <div class="cat-total">
      <span>Total expenses</span>
      <strong>Rp. {{formatNumber .Total}}</strong>
    </div>
    <ul class="cat-list">
      {{range .Items}}
        <li class="cat-item">
          <div class="cat-item-top">
            <span class="cat-name">{{.Name}}</span>
            <span class="cat-amt">Rp. {{formatNumber .Amount}} <em>{{.PctLabel}}%</em></span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width: {{.Bar}}%"></div></div>
        </li>
      {{end}}
    </ul>
  {{else}}
    <p class="muted">No expenses in this period.</p>
  {{end}}
</div>
